<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FanOS+</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
body{height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#0a0a1a;color:#000;position:relative}

/* ======================= ОБОИ ======================= */
.wallpaper{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,#00bfff 0%,#7a3cff 50%,#b03cff 100%);background-size:200% 200%;animation:bgShift 8s ease infinite;transition:background .3s}
.wallpaper.default-wp{background:linear-gradient(135deg,#00bfff 0%,#7a3cff 50%,#b03cff 100%);background-size:200% 200%;animation:bgShift 8s ease infinite}
.wallpaper::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 30% 40%,rgba(0,100,255,.9) 0%,transparent 70%),radial-gradient(ellipse 50% 60% at 75% 60%,rgba(180,0,255,.8) 0%,transparent 70%),radial-gradient(ellipse 40% 50% at 20% 80%,rgba(0,200,255,.7) 0%,transparent 70%);filter:blur(20px);animation:shapeShift 12s ease-in-out infinite alternate;pointer-events:none}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes shapeShift{0%{transform:scale(1) rotate(0deg)}100%{transform:scale(1.15) rotate(4deg)}}

/* Если обои кастомные — прячем блики и анимацию */
.wallpaper.custom-wp{animation:none;background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important}
.wallpaper.custom-wp::before{display:none !important;opacity:0 !important;background:none !important;animation:none !important}

/* ======================= РАБОЧИЙ СТОЛ ======================= */
.desktop{position:relative;flex:1;overflow:hidden;z-index:1}
.app-icon{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;width:80px;text-align:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));touch-action:none;transition:filter .15s}
.app-icon:active{cursor:grabbing}
.app-icon.dragging{z-index:9999;filter:drop-shadow(0 12px 24px rgba(0,0,0,.9))}
.icon-visual{width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:32px;border:3px solid #000;border-radius:16px;box-shadow:3px 3px 0 #000;transition:transform .1s;flex-shrink:0;pointer-events:none;overflow:hidden;background:#fff}
.icon-visual img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.app-icon:hover .icon-visual{transform:scale(1.05)}
.app-label{font-size:11px;font-weight:800;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 2px 4px #000;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.icon-delete{position:absolute;top:-6px;right:2px;width:22px;height:22px;background:#ff2222;color:#fff;border:2px solid #000;border-radius:50%;font-size:14px;font-weight:900;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:10;box-shadow:2px 2px 0 #000}
.app-icon:hover .icon-delete{display:flex}
.icon-delete:hover{background:#cc0000;transform:scale(1.1)}

.empty-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#000;font-size:16px;line-height:1.8;background:rgba(255,255,255,.85);border:3px solid #000;padding:24px 32px;border-radius:8px;box-shadow:6px 6px 0 #000;font-weight:700;pointer-events:none}
.empty-hint .big{font-size:48px;display:block;margin-bottom:12px}

/* ======================= ПАНЕЛЬ ЗАДАЧ ======================= */
.taskbar{position:fixed;bottom:0;left:0;right:0;height:48px;background:#e8e8f0;border-top:4px solid #000;display:flex;align-items:center;z-index:1000;box-shadow:0 -2px 0 rgba(0,0,0,.1)}
.tb-logo{height:100%;padding:0 14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#000;border-right:3px solid #000;background:#f5f5ff;letter-spacing:-.3px;white-space:nowrap}
.tb-logo .plus{color:#ff6600;margin-left:2px;font-size:18px}
.tb-url{flex:1;height:100%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#000;background:#d8d8e8;border-right:3px solid #000;padding:0 10px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;position:relative}
.tb-battery{height:100%;padding:0 12px;display:flex;align-items:center;gap:4px;border-left:3px solid #000;background:#f5f5ff}
.battery-body{width:34px;height:18px;border:3px solid #000;border-radius:3px;position:relative;background:#fff}
.battery-body::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:3px;height:8px;background:#000;border-radius:0 2px 2px 0}
.battery-fill{position:absolute;top:2px;left:2px;bottom:2px;width:75%;background:#ffcc00;border-radius:1px}

/* ======================= КОНТЕКСТНОЕ МЕНЮ ======================= */
.ctx-menu{position:fixed;z-index:6000;background:#e8e8f0;border:3px solid #000;border-radius:4px;box-shadow:4px 4px 0 #000;padding:4px;display:none;min-width:180px}
.ctx-menu.open{display:block}
.ctx-item{padding:9px 14px;font-size:13px;font-weight:800;color:#000;cursor:pointer;border-radius:2px;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:#ffcc00}
.ctx-item.danger:hover{background:#ff5f57;color:#fff}
.ctx-sep{height:2px;background:#000;margin:4px 0;opacity:.15}

/* ======================= МОДАЛКА УСТАНОВКИ ======================= */
.modal-overlay{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:#e8e8f0;border:4px solid #000;border-radius:4px;box-shadow:8px 8px 0 rgba(0,0,0,.4);max-width:440px;width:100%;overflow:hidden;animation:modalPop .2s ease-out}
@keyframes modalPop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{background:#000;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px}
.modal-body{padding:24px 22px;text-align:center}
.modal-body .file-name{font-weight:900;font-size:18px;color:#000;margin-bottom:8px;word-break:break-all}
.modal-body .file-size{font-size:13px;color:#555;font-weight:700;margin-bottom:18px}
.wait-text{font-size:14px;color:#333;font-weight:700;margin-bottom:12px}
.progress-wrap{height:12px;border:3px solid #000;border-radius:3px;background:#fff;overflow:hidden;margin-bottom:8px}
.progress-bar{height:100%;width:0%;background:#ffcc00;transition:width .1s linear}
.progress-time{font-size:13px;font-weight:800;color:#000;margin-bottom:20px}
.modal-actions{display:flex;gap:10px}
.btn{flex:1;padding:12px 16px;font-weight:900;font-size:14px;border:3px solid #000;border-radius:3px;cursor:pointer;transition:transform .1s,background .15s;text-transform:uppercase}
.btn:active{transform:scale(.96)}
.btn-cancel{background:#e0e0e0;color:#000;box-shadow:3px 3px 0 #000}
.btn-cancel:hover{background:#c8c8c8}
.btn-install{background:#ffcc00;color:#000;box-shadow:3px 3px 0 #000}
.btn-install:hover{background:#ffaa00}
.btn-install:disabled{background:#999;color:#555;cursor:not-allowed;box-shadow:none;transform:none}

/* ======================= ОКНО ПРОГРАММЫ ======================= */
.app-window{position:fixed;inset:0;z-index:3000;display:none;flex-direction:column;background:#000}
.app-window.active{display:flex}
.window-header{height:44px;background:#e8e8f0;border-bottom:4px solid #000;display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0}
.window-header .win-title{font-weight:900;font-size:15px;color:#000;display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.window-header .win-title .dot{width:12px;height:12px;border:2px solid #000;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.red{background:#ff5f57}.dot.yellow{background:#febc2e}.dot.green{background:#28c840}
.win-close-btn{background:#ffcc00;border:3px solid #000;border-radius:3px;color:#000;width:34px;height:34px;font-size:20px;font-weight:900;line-height:1;cursor:pointer;box-shadow:2px 2px 0 #000;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s,background .15s}
.win-close-btn:hover{background:#ffaa00}
.win-close-btn:active{transform:scale(.92)}
.window-iframe{flex:1;width:100%;border:none;background:#fff;display:block}

/* ======================= АДАПТИВ ======================= */
@media(max-width:600px){
    .app-icon{width:70px}
    .icon-visual{width:56px;height:56px;font-size:28px;border-radius:14px}
    .icon-visual img{border-radius:11px}
    .app-label{font-size:10px;max-width:70px}
    .taskbar{height:44px}
    .tb-logo{font-size:13px;padding:0 8px}
    .tb-url{font-size:12px;padding:0 6px}
    .tb-battery{padding:0 6px}
    .battery-body{width:28px;height:16px}
    .modal-body{padding:18px 16px}
    .modal-body .file-name{font-size:15px}
    .btn{font-size:12px;padding:10px 12px}
}
@media(max-width:400px){
    .tb-url{font-size:10px}
    .empty-hint{font-size:13px;padding:16px 20px}
}
</style>
</head>
<body>

<div class="wallpaper default-wp" id="wallpaper"></div>

<div class="desktop" id="desktop">
    <div id="iconsContainer"></div>
</div>

<div class="taskbar">
    <div class="tb-logo">FanOS<span class="plus">+</span></div>
    <div class="tb-url">www.FanOS.ru</div>
    <div class="tb-battery">
        <div class="battery-body"><div class="battery-fill"></div></div>
    </div>
</div>

<input type="file" id="fileInput" style="display:none" accept=".html,.htm" multiple>
<input type="file" id="iconInput" style="display:none" accept="image/*">

<div class="ctx-menu" id="ctxMenu">
    <div class="ctx-item" id="ctxOpen">📂 Открыть</div>
    <div class="ctx-item" id="ctxChangeIcon">🖼️ Изменить иконку</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" id="ctxDelete">🗑️ Удалить</div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <div class="modal-header"><span style="font-size:20px">⚙️</span><span>Установка приложения</span></div>
        <div class="modal-body">
            <div class="file-name" id="modalFileName">app.html</div>
            <div class="file-size" id="modalFileSize">0 KB</div>
            <div class="wait-text">Подготовка к установке...</div>
            <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
            <div class="progress-time" id="progressTime">5 сек</div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="btnCancel">Отмена</button>
                <button class="btn btn-install" id="btnInstall" disabled>Установить</button>
            </div>
        </div>
    </div>
</div>

<div class="app-window" id="appWindow">
    <div class="window-header">
        <div class="win-title">
            <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            <span id="windowTitle" style="margin-left:4px;">Программа</span>
        </div>
        <button class="win-close-btn" id="winCloseBtn" title="Закрыть">✕</button>
    </div>
    <iframe class="window-iframe" id="appIframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-top-navigation-by-user-activation"></iframe>
</div>

<script>
(function() {
'use strict';

let apps = [];
let appCounter = 0;
let wifiConfig = { ssid: '', password: '' };
let accountConfig = { email: '', password: '' };
let ctxTargetAppId = null;

const wallpaperEl = document.getElementById('wallpaper');
const savedWallpaperKey = 'fanos_wallpaper';
const savedWallpaperIdKey = 'fanos_current_wallpaper_id';

/* Загрузка обоев при старте */
try {
    const savedWp = localStorage.getItem(savedWallpaperKey);
    if (savedWp) {
        wallpaperEl.classList.remove('default-wp');
        wallpaperEl.classList.add('custom-wp');
        wallpaperEl.style.background = 'url(' + savedWp + ') center/cover no-repeat';
    }
} catch(e) {}

/* ============================================================
   ВСТРОЕННЫЕ HTML ПРОГРАММЫ (без изменений)
   ============================================================ */
/* 1. НАСТРОЙКИ */
const HTML_SETTINGS = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{background:#f0f0f5;color:#000}.h{background:#000;color:#fff;padding:18px 24px;font-weight:900;font-size:20px;display:flex;gap:12px;border-bottom:4px solid #000}.tabs{display:flex;gap:6px;padding:14px 18px 0;background:#e8e8f0;border-bottom:4px solid #000;flex-wrap:wrap}.tab{padding:10px 18px;font-weight:900;font-size:14px;background:#d0d0dc;border:3px solid #000;border-bottom:none;border-radius:4px 4px 0 0;cursor:pointer;margin-bottom:-4px}.tab.active{background:#ffcc00;transform:translateY(-2px)}.content{padding:24px;max-width:640px;margin:0 auto}.section{display:none}.section.active{display:block}.section h2{font-size:20px;font-weight:900;margin-bottom:18px;padding-bottom:10px;border-bottom:3px solid #000}.row{background:#fff;border:3px solid #000;border-radius:4px;padding:16px;margin-bottom:14px;box-shadow:3px 3px 0 #000}.row label{display:block;font-weight:900;font-size:13px;margin-bottom:6px}.row input{width:100%;padding:10px 12px;border:3px solid #000;border-radius:3px;font-size:14px;font-weight:700;outline:none;background:#f5f5ff}.row input:focus{background:#fffbe0}.save{background:#ffcc00;border:3px solid #000;padding:12px 22px;font-weight:900;font-size:14px;cursor:pointer;box-shadow:3px 3px 0 #000}.save:hover{background:#ffaa00}.save:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}.status-ok{display:inline-flex;align-items:center;gap:8px;background:#00c853;color:#fff;border:3px solid #000;padding:8px 16px;font-weight:900;font-size:14px;box-shadow:3px 3px 0 #000}.status-ok .dot{width:10px;height:10px;background:#fff;border-radius:50%;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}.info-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:2px solid #d0d0d0;font-size:14px}.info-line:last-child{border-bottom:none}.info-line .k{color:#555;font-weight:800}.info-line .v{font-weight:900}.app-list-item{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid #000;border-radius:4px;padding:12px 16px;margin-bottom:10px;box-shadow:3px 3px 0 #000}.app-list-item .ico{width:44px;height:44px;border:3px solid #000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;background:#f5f5ff}.app-list-item .ico img{width:100%;height:100%;object-fit:cover;border-radius:9px}.app-list-item .info{flex:1;min-width:0}.app-list-item .info .nm{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.app-list-item .info .sub{font-size:11px;color:#555;font-weight:700}.app-list-item button{padding:8px 14px;border:3px solid #000;border-radius:3px;font-weight:900;font-size:12px;cursor:pointer;box-shadow:2px 2px 0 #000;background:#ffcc00}.app-list-item button:hover{background:#ffaa00}.app-list-item button.danger{background:#ff5f57;color:#fff}.app-list-item button.danger:hover{background:#cc0000}.upload-area{margin-bottom:18px;padding:18px;background:#fff;border:3px dashed #000;border-radius:4px;text-align:center}.upload-area .btn-upload{background:#ffcc00;border:3px solid #000;padding:14px 28px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 #000;border-radius:3px}.upload-area .btn-upload:hover{background:#ffaa00}.upload-area .btn-upload:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:12px}.wp-item{aspect-ratio:1;border:3px solid #000;border-radius:4px;cursor:pointer;box-shadow:3px 3px 0 #000;overflow:hidden;position:relative;transition:transform .1s;background:#ddd}.wp-item:hover{transform:translateY(-2px)}.wp-item img{width:100%;height:100%;object-fit:cover;display:block}.wp-item .check{position:absolute;top:4px;right:4px;background:#00c853;color:#fff;width:22px;height:22px;border-radius:50%;border:2px solid #000;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}.wp-item .del{position:absolute;bottom:4px;right:4px;background:#ff5f57;color:#fff;width:22px;height:22px;border-radius:50%;border:2px solid #000;font-size:14px;font-weight:900;display:none;align-items:center;justify-content:center;cursor:pointer;line-height:1}.wp-item:hover .del{display:flex}.wp-empty{grid-column:1/-1;text-align:center;padding:30px;font-weight:700;color:#555}.btn-default-wp{background:#ffcc00;border:3px solid #000;padding:10px 20px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:3px 3px 0 #000;border-radius:3px;margin-top:12px}.btn-default-wp:hover{background:#ffaa00}</style></head><body>
<div class="h">⚙️ Настройки FanOS+</div>
<div class="tabs">
<div class="tab active" data-tab="wifi">📶 Wi-Fi</div>
<div class="tab" data-tab="account">👤 Аккаунт</div>
<div class="tab" data-tab="wallpaper">🖼️ Обои</div>
<div class="tab" data-tab="about">💻 О системе</div>
<div class="tab" data-tab="apps">📦 Приложения</div>
</div>
<div class="content">
<div class="section active" id="sec-wifi">
<h2>📶 Настройки Wi-Fi</h2>
<div class="row"><label>Название сети (SSID)</label><input type="text" id="wifiSsid" placeholder="HomeWiFi"></div>
<div class="row"><label>Пароль</label><input type="password" id="wifiPass" placeholder="••••••••"><div style="font-size:12px;color:#555;font-weight:700;margin-top:6px" id="wifiHint">Введите название сети и пароль</div></div>
<button class="save" id="saveWifi">💾 Сохранить и подключиться</button>
</div>
<div class="section" id="sec-account">

<div class="row"><label>Почта / Email</label><input type="email" id="accEmail" placeholder="user@example.com"></div>
<div class="row"><label>Пароль</label><input type="password" id="accPass" placeholder="••••••••"><div style="font-size:12px;color:#555;font-weight:700;margin-top:6px" id="accHint">Войдите в аккаунт FanOS</div></div>
<button class="save" id="saveAcc">💾 Сохранить аккаунт</button>
</div>
<div class="section" id="sec-wallpaper">
<h2>🖼️ Обои рабочего стола</h2>
<div class="row">
<p style="font-size:13px;color:#555;font-weight:700;margin-bottom:12px">Выберите обои из файлов, сохранённых «Навсегда» в приложении «Файлы».</p>

</div>

    <div style="font-size:12px;color:#555;font-weight:700;margin-top:10px">Выберите .html или .htm файлы для установки</div>

<script>
(function(){
const tabs=document.querySelectorAll('.tab');const sections={wifi:document.getElementById('sec-wifi'),account:document.getElementById('sec-account'),wallpaper:document.getElementById('sec-wallpaper'),about:document.getElementById('sec-about'),apps:document.getElementById('sec-apps')};
tabs.forEach(t=>{t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');Object.values(sections).forEach(s=>s.classList.remove('active'));sections[t.dataset.tab].classList.add('active');if(t.dataset.tab==='apps')renderApps();if(t.dataset.tab==='wallpaper')loadWallpapers()})});

    else if(['html','htm'].includes(e)){body.innerHTML='<iframe src="'+f.url+'" sandbox="allow-scripts allow-same-origin"></iframe>'}

    let html='';
    if(isImage){
        if(f.saved){
            html+='<button class="green" disabled>✓ Сохранён навсегда</button>';
        } else {
            if(f.size > MAX_SAVE_SIZE){
                html+='<button disabled title="Файл больше 20 МБ">⚠️ Слишком большой (макс. 20 МБ)</button>';
            } else {

    html+='<button data-close="1">Закрыть</button>';
    actions.innerHTML=html;
    actions.querySelectorAll('[data-save]').forEach(b=>{b.addEventListener('click',()=>{
        saveForever(parseInt(b.dataset.save));

    })});
    actions.querySelectorAll('[data-download]').forEach(b=>{b.addEventListener('click',()=>{

    })});
    actions.querySelectorAll('[data-close]').forEach(b=>{b.addEventListener('click',()=>{p.classList.remove('open');body.innerHTML='';actions.innerHTML=''})});
    p.classList.add('open');
}
function saveForever(idx){
    const f=files[idx];if(!f)return;
    if(f.size>MAX_SAVE_SIZE){alert('Файл больше 20 МБ. Нельзя сохранить навсегда.');return}

}

function renderIcons() {
    iconsContainer.innerHTML = '';
    if (apps.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.innerHTML = '<span class="big">🖥️</span>Рабочий стол пуст<br>Загрузи HTML в <b>Настройках → Приложения</b>';
        iconsContainer.appendChild(hint);
        return;
    }
    apps.forEach(app => {
        const iconDiv = document.createElement('div');
        iconDiv.className = 'app-icon';
        iconDiv.dataset.id = app.id;
        iconDiv.style.left = app.x + 'px';
        iconDiv.style.top = app.y + 'px';
        iconDiv.title = app.name;

        const visual = document.createElement('div');
        visual.className = 'icon-visual';
        if (app.iconImage) visual.innerHTML = '<img src="' + app.iconImage + '">';
        else { visual.textContent = app.icon; if (app.bg) visual.style.background = app.bg; }

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'icon-delete';
        deleteBtn.textContent = '×';
        deleteBtn.title = 'Удалить';
        deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); removeApp(app.id); });

        const label = document.createElement('div');
        label.className = 'app-label';
        label.textContent = app.name;

        iconDiv.appendChild(visual);
        iconDiv.appendChild(deleteBtn);
        iconDiv.appendChild(label);

        makeDraggable(iconDiv, app);

        let clickTimer = null;
        iconDiv.addEventListener('click', (e) => {
            if (e.target === deleteBtn) return;
            if (iconDiv.dataset.dragged === '1') { iconDiv.dataset.dragged = '0'; return; }
            if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; openApp(app); }
            else { clickTimer = setTimeout(() => { clickTimer = null; }, 250); }
        });
        iconDiv.addEventListener('dblclick', () => {
            if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
            openApp(app);
        });

        iconDiv.addEventListener('contextmenu', (e) => {
            e.preventDefault(); e.stopPropagation();
            showCtxMenu(e.clientX, e.clientY, app);
        });

        iconsContainer.appendChild(iconDiv);
    });
}

function makeDraggable(el, app) {
    let startX=0,startY=0,origX=0,origY=0,dragging=false,moved=false;
    function down(cx,cy){dragging=true;moved=false;startX=cx;startY=cy;origX=app.x;origY=app.y;el.classList.add('dragging')}
    function move(cx,cy){if(!dragging)return;const dx=cx-startX,dy=cy-startY;if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true;let nx=origX+dx,ny=origY+dy;const w=desktop.clientWidth,h=desktop.clientHeight;nx=Math.max(0,Math.min(nx,w-80));ny=Math.max(0,Math.min(ny,h-90));app.x=nx;app.y=ny;el.style.left=nx+'px';el.style.top=ny+'px'}
    function up(){if(!dragging)return;dragging=false;el.classList.remove('dragging');if(moved)el.dataset.dragged='1'}
    el.addEventListener('mousedown',(e)=>{if(e.button!==0||e.target.classList.contains('icon-delete'))return;e.preventDefault();down(e.clientX,e.clientY)});
    document.addEventListener('mousemove',(e)=>move(e.clientX,e.clientY));
    document.addEventListener('mouseup',up);
    el.addEventListener('touchstart',(e)=>{if(e.target.classList.contains('icon-delete'))return;const t=e.touches[0];down(t.clientX,t.clientY)},{passive:true});
    el.addEventListener('touchmove',(e)=>{if(!dragging)return;e.preventDefault();const t=e.touches[0];move(t.clientX,t.clientY)},{passive:false});
    el.addEventListener('touchend',up);
    el.addEventListener('touchcancel',up);
}

function getNextPosition() {
    const w = desktop.clientWidth || 800;
    const h = desktop.clientHeight || 600;
    const cols = Math.max(1, Math.floor((w - 20) / 90));
    const col = apps.length % cols;
    const row = Math.floor(apps.length / cols);
    return { x: Math.min(16 + col * 90, w - 90), y: Math.min(16 + row * 100, h - 110) };
}

window.addEventListener('message', (e) => {
    if (!e.data || !e.data.type) return;
    if (e.data.type === 'trigger-upload') {
        fileInput.click();
    }
    if (e.data.type === 'save-forever') {
        try {
            const list = JSON.parse(localStorage.getItem('fanos_saved_wallpapers') || '[]');
            const newItem = { id: 'wp-' + Date.now(), name: e.data.name, data: e.data.data };
            list.push(newItem);
            localStorage.setItem('fanos_saved_wallpapers', JSON.stringify(list));
            e.source.postMessage({type:'save-forever-ok'},'*');
        } catch(err) {
            alert('Не удалось сохранить обои: память браузера переполнена');
        }
    }
    if (e.data.type === 'get-wallpapers') {
        let list = [];
        try { list = JSON.parse(localStorage.getItem('fanos_saved_wallpapers') || '[]'); } catch(err) {}
        let current = null;
        try { current = localStorage.getItem(savedWallpaperIdKey); } catch(err) {}
        e.source.postMessage({type:'wallpapers-list', wallpapers: list, current: current},'*');
    }
    if (e.data.type === 'set-wallpaper') {
        if (!e.data.id) {
            wallpaperEl.classList.add('default-wp');
            wallpaperEl.classList.remove('custom-wp');
            wallpaperEl.style.background = '';
            try { localStorage.removeItem(savedWallpaperKey); localStorage.removeItem(savedWallpaperIdKey); } catch(err) {}
        } else {
            let list = [];
            try { list = JSON.parse(localStorage.getItem('fanos_saved_wallpapers') || '[]'); } catch(err) {}
            const wp = list.find(w => w.id === e.data.id);
            if (wp) {
                wallpaperEl.classList.remove('default-wp');
                wallpaperEl.classList.add('custom-wp');
                wallpaperEl.style.background = 'url(' + wp.data + ') center/cover no-repeat';
                try { localStorage.setItem(savedWallpaperKey, wp.data); localStorage.setItem(savedWallpaperIdKey, wp.id); } catch(err) {}
            }
        }
    }
    if (e.data.type === 'delete-wallpaper') {
        try {
            let list = JSON.parse(localStorage.getItem('fanos_saved_wallpapers') || '[]');
            list = list.filter(w => w.id !== e.data.id);
            localStorage.setItem('fanos_saved_wallpapers', JSON.stringify(list));
            e.source.postMessage({type:'wallpapers-list', wallpapers: list, current: localStorage.getItem(savedWallpaperIdKey)},'*');
        } catch(err) {}
    }
});

fileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    const htmlFiles = files.filter(f => /\.html?$/i.test(f.name));
    if (htmlFiles.length === 0) { alert('Нужны .html или .htm'); fileInput.value = ''; return; }
    processFilesQueue(htmlFiles, 0);
    fileInput.value = '';
});

let currentInstall = null;
function processFilesQueue(files, index) {
    if (index >= files.length) return;
    const file = files[index];
    const reader = new FileReader();
    reader.onload = (ev) => showInstallModal(file.name, ev.target.result, file.size, () => processFilesQueue(files, index + 1));
    reader.onerror = () => { alert('Ошибка: ' + file.name); processFilesQueue(files, index + 1); };
    reader.readAsText(file, 'UTF-8');
}

function showInstallModal(fileName, html, fileSize, onDone) {
    if (currentInstall) currentInstall.cancel();
    modalFileName.textContent = fileName;
    modalFileSize.textContent = (fileSize / 1024).toFixed(1) + ' KB';
    progressBar.style.width = '0%';
    progressTime.textContent = '5 сек';
    btnInstall.disabled = true;
    btnInstall.textContent = 'Установить';
    modalOverlay.classList.add('open');
    const total = 5000, start = Date.now();
    let tickTimer = null, finished = false;
    const ctx = { cancel: function() { if (finished) return; finished = true; clearInterval(tickTimer); clearTimeout(ctx.installTimeout); modalOverlay.classList.remove('open'); currentInstall = null; if (onDone) onDone(); } };
    tickTimer = setInterval(() => {
        const elapsed = Date.now() - start;
        const p = Math.min(100, (elapsed / total) * 100);
        progressBar.style.width = p + '%';
        progressTime.textContent = Math.max(0, Math.ceil((total - elapsed) / 1000)) + ' сек';
        if (p >= 100) { clearInterval(tickTimer); progressTime.textContent = 'Готово'; btnInstall.disabled = false; }
    }, 100);
    ctx.installTimeout = setTimeout(() => { if (!finished) doInstall(); }, total);
    function doInstall() {
        if (finished) return; finished = true;
        clearInterval(tickTimer); clearTimeout(ctx.installTimeout);
        btnInstall.disabled = true; btnInstall.textContent = 'Установка...';
        setTimeout(() => { addApp(fileName, html); modalOverlay.classList.remove('open'); currentInstall = null; if (onDone) onDone(); }, 300);
    }
    btnInstall.onclick = doInstall;
    btnCancel.onclick = ctx.cancel;
    currentInstall = ctx;
}

/* ============================================================
   ДОБАВЛЕНИЕ / УДАЛЕНИЕ
   ============================================================ */
function addApp(fileName, html) {
    appCounter++;
    const c = ICON_COLORS[(appCounter - 1) % ICON_COLORS.length];
    const emoji = ICON_EMOJIS[(appCounter - 1) % ICON_EMOJIS.length];
    const cleanName = fileName.replace(/\.html?$/i, '');
    const pos = getNextPosition();
    apps.push({ id: 'app-' + appCounter + '-' + Date.now(), name: cleanName, icon: emoji, bg: c.bg, border: '#000', html: html, fileName: fileName, x: pos.x, y: pos.y, iconImage: null, isSystem: false });
    renderIcons();
}

function removeApp(id) {
    const app = apps.find(a => a.id === id);
    if (!app) return;
    if (app.isSystem) { alert('Системное приложение нельзя удалить.'); return; }
    if (!confirm('Удалить «' + app.name + '»?')) return;
    apps = apps.filter(a => a.id !== id);
    renderIcons();
}

function openApp(app) {
    windowTitle.textContent = app.name;
    appIframe.removeAttribute('src');
    appIframe.srcdoc = app.html;
    appWindow.classList.add('active');
    document.body.style.overflow = 'hidden';
    if (app.isSettings) {
        setTimeout(() => {
            appIframe.contentWindow.postMessage({ type: 'wifi-loaded', ssid: wifiConfig.ssid, password: wifiConfig.password }, '*');
            appIframe.contentWindow.postMessage({ type: 'account-loaded', email: accountConfig.email, password: accountConfig.password }, '*');
        }, 200);
    }
}

function closeApp() {
    appWindow.classList.remove('active');
    appIframe.srcdoc = '';
    appIframe.src = 'about:blank';
    document.body.style.overflow = '';
}
winCloseBtn.addEventListener('click', closeApp);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && appWindow.classList.contains('active')) closeApp(); });

window.addEventListener('message', (e) => {
    if (!e.data || !e.data.type) return;
    switch (e.data.type) {
        case 'save-wifi': wifiConfig.ssid = e.data.ssid; wifiConfig.password = e.data.password; break;
        case 'get-wifi': e.source.postMessage({ type: 'wifi-loaded', ssid: wifiConfig.ssid, password: wifiConfig.password }, '*'); break;
        case 'save-account': accountConfig.email = e.data.email; accountConfig.password = e.data.password; break;
        case 'get-account': e.source.postMessage({ type: 'account-loaded', email: accountConfig.email, password: accountConfig.password }, '*'); break;
        case 'get-apps':
            e.source.postMessage({ type: 'apps-list', apps: apps.map(a => ({ id: a.id, name: a.name, icon: a.icon, iconImage: a.iconImage, fileName: a.fileName, isSystem: a.isSystem })) }, '*');
            break;
        case 'open-app': { const a = apps.find(x => x.id === e.data.id); if (a) openApp(a); break; }
        case 'delete-app': {
            const a = apps.find(x => x.id === e.data.id);
            if (a && !a.isSystem) { apps = apps.filter(x => x.id !== e.data.id); renderIcons(); }
            break;
        }
    }
});

}

/* ============================================================
   СТАРТ
   ============================================================ */
addSystemApps();
renderIcons();

window.addEventListener('resize', () => {
    const w = desktop.clientWidth, h = desktop.clientHeight;
    let changed = false;
    apps.forEach(a => {
        if (a.x > w - 80) { a.x = Math.max(0, w - 80); changed = true; }
        if (a.y > h - 90) { a.y = Math.max(0, h - 90); changed = true; }
    });
    if (changed) renderIcons();
});

})();
</script>
</body>
</html>
